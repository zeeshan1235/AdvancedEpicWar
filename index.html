<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>body { margin: 0; background: #333; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; } canvas { background: #000; }</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = 300; canvas.height = 500;
let playerX = 140, playerY = 400, score = 0;
function draw() {
    ctx.clearRect(0, 0, 300, 500);
    ctx.fillStyle = '#0f0'; ctx.fillRect(playerX, playerY, 20, 20);
    ctx.fillStyle = '#fff'; ctx.fillText('SCORE: ' + score, 10, 20);
    requestAnimationFrame(draw);
}
canvas.addEventListener('touchmove', (e) => { playerX = e.touches[0].clientX - 10; });
draw();
</script>
</body>
</html>
