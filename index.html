<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0e1116" />
<title>Rail Runner — Endless Runner</title>
<style>
  :root{
    --bg:#0e1116; --panel:rgba(22,27,34,0.96); --panel-2:rgba(28,35,48,0.96);
    --acc:#ff8c3b; --acc2:#4fa3ff; --gold:#ffce54; --gem:#5bb8ff; --text:#e8edf2;
    --muted:#8a97a6; --good:#5fd08a; --bad:#ff6b6b; --shadow:0 14px 44px rgba(0,0,0,0.6);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}
  html,body{height:100%;overflow:hidden;background:var(--bg);font-family:'Inter','Segoe UI',system-ui,sans-serif;color:var(--text);}
  #game{position:fixed;inset:0;} canvas{display:block;width:100%;height:100%;}

  #speedfx{position:fixed;inset:0;z-index:6;pointer-events:none;opacity:0;
    background:radial-gradient(ellipse at 50% 50%, rgba(255,255,255,0) 45%, rgba(255,255,255,0.10) 100%);}
  #vignette{position:fixed;inset:0;z-index:5;pointer-events:none;box-shadow:inset 0 0 220px rgba(0,0,0,0.7), inset 0 0 80px rgba(0,0,0,0.4);}
  #flash{position:fixed;inset:0;z-index:7;pointer-events:none;opacity:0;background:rgba(200,40,40,0.4);transition:opacity .08s;}
  #shieldflash{position:fixed;inset:0;z-index:7;pointer-events:none;opacity:0;background:radial-gradient(circle,rgba(95,208,138,0) 45%,rgba(95,208,138,0.35));transition:opacity .25s;}

  .screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:max(20px,env(safe-area-inset-top)) 18px max(20px,env(safe-area-inset-bottom));z-index:20;
    background:linear-gradient(180deg,rgba(14,17,22,0.7),rgba(8,10,14,0.96));backdrop-filter:blur(6px);text-align:center;}
  .hidden{display:none !important;}
  .logo{font-weight:800;letter-spacing:-1px;line-height:0.92;}
  .logo .a{font-size:clamp(46px,14vw,96px);background:linear-gradient(95deg,var(--acc),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .logo .b{display:block;font-size:clamp(46px,14vw,96px);background:linear-gradient(95deg,var(--acc2),#7fd0ff);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .tagline{margin-top:8px;color:var(--muted);letter-spacing:3px;font-size:11px;text-transform:uppercase;font-weight:600;}
  .badge{margin-top:6px;font-size:10px;letter-spacing:2px;color:var(--gold);border:1px solid rgba(255,206,84,0.35);padding:3px 12px;border-radius:20px;font-weight:600;}

  .btn{position:relative;border:none;cursor:pointer;font-family:inherit;font-weight:700;letter-spacing:.3px;color:#1a1207;border-radius:14px;padding:16px 26px;font-size:16px;margin:7px;min-width:210px;
    background:linear-gradient(135deg,var(--acc),#ffa860);box-shadow:0 8px 0 #b85d1c,0 16px 28px rgba(255,140,59,0.3);transition:transform .08s,box-shadow .08s;}
  .btn:active{transform:translateY(5px);box-shadow:0 3px 0 #b85d1c;}
  .btn.sec{background:linear-gradient(135deg,var(--acc2),#7fc0ff);box-shadow:0 8px 0 #2563a8;color:#06101c;}
  .btn.gold{background:linear-gradient(135deg,var(--gold),#ffd97a);box-shadow:0 8px 0 #b8902a;}
  .btn.ghost{background:rgba(255,255,255,0.06);color:var(--text);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,0.16);}
  .btn.ghost:active{transform:translateY(2px);}
  .btn.sm{min-width:auto;padding:11px 16px;font-size:13px;border-radius:11px;}
  .btn[disabled]{filter:grayscale(.7);opacity:.55;pointer-events:none;}

  .menu-stats{display:flex;gap:10px;margin:16px 0 6px;}
  .pill{display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid rgba(255,255,255,0.08);padding:8px 14px;border-radius:30px;font-size:15px;font-weight:700;}
  .menu-row{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;max-width:450px;}

  #hud{position:fixed;inset:0;z-index:10;pointer-events:none;padding:max(14px,env(safe-area-inset-top)) 16px 16px;}
  .hud-top{display:flex;justify-content:space-between;align-items:flex-start;}
  .hud-score{font-size:34px;font-weight:800;text-shadow:0 2px 14px rgba(0,0,0,0.7);line-height:1;}
  .hud-score small{display:block;font-size:11px;letter-spacing:3px;color:var(--muted);font-weight:600;margin-top:3px;}
  .hud-right{display:flex;flex-direction:column;gap:7px;align-items:flex-end;}
  .hud-chip{display:flex;align-items:center;gap:6px;background:rgba(14,17,22,0.62);border:1px solid rgba(255,255,255,0.1);padding:5px 12px;border-radius:18px;font-weight:800;font-size:16px;}
  #fps{position:fixed;left:50%;transform:translateX(-50%);top:max(14px,env(safe-area-inset-top));font-size:11px;color:var(--muted);background:rgba(14,17,22,0.55);padding:3px 9px;border-radius:10px;z-index:10;pointer-events:none;}
  #multiBadge{position:fixed;top:46%;left:50%;transform:translate(-50%,-50%) scale(0);font-size:42px;font-weight:800;color:#fff;text-shadow:0 3px 18px rgba(0,0,0,0.8);z-index:11;pointer-events:none;}
  #powBar{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:8px;z-index:11;pointer-events:none;}
  .powchip{display:flex;flex-direction:column;align-items:center;gap:3px;background:rgba(14,17,22,0.72);border:1px solid var(--acc);border-radius:13px;padding:6px 10px;min-width:54px;}
  .powchip .pi{font-size:20px;} .powchip .pt{font-size:12px;font-weight:800;color:var(--acc);}
  .powchip .pbar{width:42px;height:4px;border-radius:3px;background:rgba(255,255,255,0.15);overflow:hidden;}
  .powchip .pbar i{display:block;height:100%;background:var(--acc);}

  .panel{background:var(--panel);border:1px solid rgba(255,255,255,0.09);border-radius:20px;width:min(540px,94vw);max-height:82vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow);}
  .panel-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid rgba(255,255,255,0.08);}
  .panel-head h2{font-size:20px;letter-spacing:.5px;}
  .panel-body{overflow-y:auto;padding:14px 16px;-webkit-overflow-scrolling:touch;}
  .closeX{width:38px;height:38px;border-radius:11px;border:none;background:rgba(255,255,255,0.08);color:var(--text);font-size:20px;cursor:pointer;font-family:inherit;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .card{background:var(--panel-2);border:1px solid rgba(255,255,255,0.08);border-radius:15px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;position:relative;overflow:hidden;}
  .card .preview{width:74px;height:74px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:40px;box-shadow:inset 0 0 24px rgba(0,0,0,0.4);}
  .card h3{font-size:15px;} .card .desc{font-size:12px;color:var(--muted);line-height:1.35;min-height:32px;}
  .ribbon{position:absolute;top:8px;right:-26px;transform:rotate(40deg);background:var(--good);color:#063;font-size:10px;font-weight:800;padding:3px 28px;letter-spacing:1px;}
  .ribbon.eq{background:var(--acc2);color:#04121f;} .ribbon.lk{background:var(--bad);color:#400;}
  .list-row{display:flex;align-items:center;gap:12px;background:var(--panel-2);border-radius:13px;padding:12px 14px;margin-bottom:9px;border:1px solid rgba(255,255,255,0.07);}
  .list-row .ic{font-size:26px;width:40px;text-align:center;}
  .list-row .info{flex:1;text-align:left;} .list-row .info h4{font-size:14px;} .list-row .info p{font-size:12px;color:var(--muted);margin-top:2px;}
  .prog{height:7px;border-radius:5px;background:rgba(255,255,255,0.12);overflow:hidden;margin-top:6px;}
  .prog i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--gold));}
  .tag{font-size:11px;font-weight:800;padding:5px 10px;border-radius:9px;white-space:nowrap;}
  .tag.claim{background:var(--gold);color:#5a4300;cursor:pointer;animation:pulse 1.2s infinite;}
  .tag.done{background:rgba(95,208,138,0.18);color:var(--good);} .tag.todo{background:rgba(255,255,255,0.08);color:var(--muted);}
  @keyframes pulse{50%{transform:scale(1.08);}}
  .daily{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;}
  .day{background:var(--panel-2);border-radius:13px;padding:12px 6px;text-align:center;border:1px solid rgba(255,255,255,0.07);position:relative;}
  .day.claimed{opacity:.5;} .day.today{border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,206,84,0.3);}
  .day .dn{font-size:11px;color:var(--muted);} .day .dr{font-size:22px;margin:5px 0;} .day .dv{font-size:12px;font-weight:800;}
  .toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--acc);padding:12px 20px;border-radius:13px;font-weight:700;z-index:40;box-shadow:var(--shadow);opacity:0;transition:opacity .3s;pointer-events:none;}
  .toast.show{opacity:1;}
  .hint{color:var(--muted);font-size:13px;margin-top:14px;line-height:1.6;max-width:370px;}
  .swipe-guide{display:flex;gap:18px;margin-top:12px;color:var(--muted);font-size:12px;flex-wrap:wrap;justify-content:center;}
  .swipe-guide b{color:var(--acc);}
  .go-stats{display:flex;gap:22px;margin:16px 0;} .go-stat{text-align:center;}
  .go-stat .v{font-size:30px;font-weight:800;color:var(--acc);} .go-stat .l{font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;}
  .lb-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:11px;margin-bottom:6px;background:var(--panel-2);}
  .lb-row.me{border:1px solid var(--gold);} .lb-rank{font-weight:800;width:30px;font-size:17px;color:var(--gold);}
  .lb-name{flex:1;text-align:left;font-weight:700;} .lb-score{font-weight:800;color:var(--acc);}
  .row-between{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;border-bottom:1px solid rgba(255,255,255,0.07);}
  .switch{width:52px;height:30px;border-radius:20px;background:rgba(255,255,255,0.15);position:relative;cursor:pointer;transition:.2s;}
  .switch.on{background:var(--acc);} .switch i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;}
  .switch.on i{left:25px;}
  #loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);z-index:60;}
  .spinner{width:54px;height:54px;border-radius:50%;border:4px solid rgba(255,140,59,0.2);border-top-color:var(--acc);animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  #loading p{margin-top:18px;color:var(--muted);letter-spacing:3px;font-size:12px;}
  .fade-in{animation:fade .4s ease both;} @keyframes fade{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
</style>
</head>
<body>
<div id="game"><canvas id="cv"></canvas></div>
<div id="vignette"></div>
<div id="speedfx"></div>
<div id="shieldflash"></div>
<div id="flash"></div>

<div id="loading"><div class="spinner"></div><p>LOADING TRACKS…</p></div>
<div id="fps" class="hidden"></div>

<div id="hud" class="hidden">
  <div class="hud-top">
    <div><div class="hud-score" id="scoreVal">0</div><small>SCORE</small></div>
    <div class="hud-right">
      <button class="btn sm ghost" id="pauseBtn" style="pointer-events:auto">⏸</button>
      <div class="hud-chip"><span style="color:var(--gold)">●</span><span id="runCoins">0</span></div>
      <div class="hud-chip"><span style="color:var(--gem)">◆</span><span id="runGems">0</span></div>
    </div>
  </div>
  <div id="multiBadge"></div>
  <div id="powBar"></div>
</div>

<div id="menu" class="screen">
  <div class="logo fade-in"><span class="a">RAIL</span><span class="b">RUNNER</span></div>
  <div class="tagline fade-in">endless rails · escape the express</div>
  <div class="badge fade-in">REALISTIC EDITION</div>
  <div class="menu-stats fade-in">
    <div class="pill"><span style="color:var(--gold)">●</span><span id="mCoins">0</span></div>
    <div class="pill"><span style="color:var(--gem)">◆</span><span id="mGems">0</span></div>
    <div class="pill"><span>🏆</span><span id="mHigh">0</span></div>
  </div>
  <button class="btn gold fade-in" id="playBtn">▶ PLAY</button>
  <div class="menu-row fade-in">
    <button class="btn sm ghost" id="openShop">🛒 Shop</button>
    <button class="btn sm ghost" id="openSkins">🏃 Runners</button>
    <button class="btn sm ghost" id="openUpgrades">⚡ Upgrades</button>
  </div>
  <div class="menu-row fade-in">
    <button class="btn sm ghost" id="openMissions">🎯 Missions</button>
    <button class="btn sm ghost" id="openDaily">🎁 Daily</button>
    <button class="btn sm ghost" id="openAch">🏅 Awards</button>
    <button class="btn sm ghost" id="openLb">📊 Ranks</button>
    <button class="btn sm ghost" id="openSettings">⚙ Settings</button>
  </div>
  <div class="swipe-guide fade-in"><span>⬅➡ <b>Lanes</b></span><span>⬆ <b>Jump</b></span><span>⬇ <b>Roll</b></span><span>⌨ Arrows</span></div>
</div>

<div id="pause" class="screen hidden">
  <h1 style="font-size:38px;letter-spacing:1px;margin-bottom:20px;">PAUSED</h1>
  <button class="btn gold" id="resumeBtn">▶ RESUME</button>
  <button class="btn ghost" id="restartBtn">↻ RESTART</button>
  <button class="btn sec" id="quitBtn">⌂ MAIN MENU</button>
</div>

<div id="over" class="screen hidden">
  <h1 style="font-size:34px;letter-spacing:1px;color:var(--acc)">GAME OVER</h1>
  <div id="newHigh" class="hidden" style="color:var(--gold);font-weight:800;letter-spacing:1px;margin-top:6px;">★ NEW HIGH SCORE! ★</div>
  <div class="go-stats">
    <div class="go-stat"><div class="v" id="oScore">0</div><div class="l">Score</div></div>
    <div class="go-stat"><div class="v" id="oCoins">0</div><div class="l">Coins</div></div>
    <div class="go-stat"><div class="v" id="oDist">0</div><div class="l">Meters</div></div>
  </div>
  <button class="btn gold" id="againBtn">↻ RUN AGAIN</button>
  <button class="btn sec" id="overMenuBtn">⌂ MAIN MENU</button>
</div>

<div id="overlay" class="screen hidden" style="background:rgba(8,10,14,0.85)">
  <div class="panel">
    <div class="panel-head"><h2 id="ovTitle">Title</h2>
      <div style="display:flex;gap:8px;align-items:center">
        <div class="pill" style="font-size:13px;padding:6px 11px"><span style="color:var(--gold)">●</span><span id="ovCoins">0</span></div>
        <div class="pill" style="font-size:13px;padding:6px 11px"><span style="color:var(--gem)">◆</span><span id="ovGems">0</span></div>
        <button class="closeX" id="ovClose">✕</button>
      </div>
    </div>
    <div id="ovTabs" class="tabs hidden"></div>
    <div class="panel-body" id="ovBody"></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/postprocessing/EffectComposer.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/postprocessing/RenderPass.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/postprocessing/ShaderPass.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/shaders/CopyShader.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/postprocessing/UnrealBloomPass.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/shaders/AfterimageShader.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/postprocessing/AfterimagePass.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/loaders/GLTFLoader.js"></script>

<script>
/* =========================================================================
   RAIL RUNNER — PRO EDITION (realistic subway endless runner).
   Loads a real animated GLTF character + external PBR textures (with safe
   procedural fallbacks). Configure all external assets in the ASSETS block
   further down. Swap those URLs for your own .glb / texture sets.
   ========================================================================= */
(function(){
'use strict';

/* ----------------------------- Persistence ----------------------------- */
const SAVE_KEY='railrunner_v1'; const mem={};
function rawGet(k){try{return localStorage.getItem(k);}catch(e){return mem[k]??null;}}
function rawSet(k,v){try{localStorage.setItem(k,v);}catch(e){mem[k]=v;}}
const defaultSave={ coins:0,gems:0,highScore:0,totalRuns:0,totalCoins:0,totalDistance:0,
  equippedSkin:'ace',ownedSkins:['ace'],
  upgrades:{magnet:0,jetpack:0,shield:0,multiplier:0,score:0},
  missions:null,missionDate:'',ach:{},daily:{streak:0,lastClaim:'',claimedToday:false},
  settings:{music:true,sfx:true,quality:'auto',night:false,showFps:false} };
let save=loadSave();
function loadSave(){try{const s=JSON.parse(rawGet(SAVE_KEY));if(s)return Object.assign(JSON.parse(JSON.stringify(defaultSave)),s,
  {upgrades:Object.assign({},defaultSave.upgrades,s.upgrades),settings:Object.assign({},defaultSave.settings,s.settings),daily:Object.assign({},defaultSave.daily,s.daily)});}catch(e){}
  return JSON.parse(JSON.stringify(defaultSave));}
function persist(){rawSet(SAVE_KEY,JSON.stringify(save));}

/* ----------------------------- Audio engine ---------------------------- */
const Audio=(function(){
  let ctx=null,master,musicGain,sfxGain,musicTimer=null;
  function init(){if(ctx)return;try{ctx=new (window.AudioContext||window.webkitAudioContext)();
    master=ctx.createGain();master.gain.value=0.6;master.connect(ctx.destination);
    musicGain=ctx.createGain();musicGain.gain.value=save.settings.music?0.26:0;musicGain.connect(master);
    sfxGain=ctx.createGain();sfxGain.gain.value=save.settings.sfx?0.8:0;sfxGain.connect(master);}catch(e){ctx=null;}}
  function resume(){if(ctx&&ctx.state==='suspended')ctx.resume();}
  function tone(f,d,t='sine',v=0.5,g=null){if(!ctx)return;const o=ctx.createOscillator(),gn=ctx.createGain();
    o.type=t;o.frequency.setValueAtTime(f,ctx.currentTime);if(g)o.frequency.exponentialRampToValueAtTime(g,ctx.currentTime+d);
    gn.gain.setValueAtTime(0.0001,ctx.currentTime);gn.gain.exponentialRampToValueAtTime(v,ctx.currentTime+0.01);
    gn.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+d);o.connect(gn);gn.connect(sfxGain);o.start();o.stop(ctx.currentTime+d+0.02);}
  function noise(d,v){if(!ctx)return;const b=ctx.createBuffer(1,ctx.sampleRate*d,ctx.sampleRate);const dt=b.getChannelData(0);
    for(let i=0;i<dt.length;i++)dt[i]=(Math.random()*2-1)*(1-i/dt.length);const s=ctx.createBufferSource();s.buffer=b;
    const g=ctx.createGain();g.gain.value=v;const f=ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=1200;s.connect(f);f.connect(g);g.connect(sfxGain);s.start();}
  const sfx={ coin:()=>{tone(1100,0.07,'triangle',0.2);tone(1500,0.08,'sine',0.14);},
    gem:()=>{tone(1300,0.09,'sine',0.22);tone(1900,0.13,'sine',0.16);},
    jump:()=>{tone(300,0.14,'sine',0.28,520);}, roll:()=>noise(0.22,0.3),
    lane:()=>tone(380,0.05,'sine',0.12), power:()=>{tone(520,0.1,'sine',0.26,780);tone(780,0.14,'sine',0.2,1040);},
    near:()=>{noise(0.18,0.22);}, hit:()=>{tone(150,0.22,'sawtooth',0.34,70);noise(0.2,0.3);},
    crash:()=>{noise(0.5,0.5);tone(110,0.5,'sawtooth',0.4,50);if(navigator.vibrate)navigator.vibrate(200);},
    buy:()=>{tone(523,0.08,'sine',0.24);tone(784,0.13,'sine',0.2);}, deny:()=>tone(150,0.18,'square',0.24,110),
    claim:()=>{tone(659,0.1,'sine',0.24);tone(988,0.14,'sine',0.2);}, ui:()=>tone(520,0.04,'sine',0.08) };
  const scale=[0,2,4,7,9];const root=98;let step=0;
  function mstep(){if(!ctx||!save.settings.music)return;const bf=root*Math.pow(2,scale[step%scale.length]/12);pad(bf);step++;}
  function pad(f){const o=ctx.createOscillator(),o2=ctx.createOscillator(),g=ctx.createGain(),fl=ctx.createBiquadFilter();
    o.type='sine';o2.type='triangle';o.frequency.value=f;o2.frequency.value=f*1.5;fl.type='lowpass';fl.frequency.value=900;
    g.gain.setValueAtTime(0.0001,ctx.currentTime);g.gain.linearRampToValueAtTime(0.22,ctx.currentTime+0.3);g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+1.1);
    o.connect(fl);o2.connect(fl);fl.connect(g);g.connect(musicGain);o.start();o2.start();o.stop(ctx.currentTime+1.2);o2.stop(ctx.currentTime+1.2);}

  for(let i=0;i<dots;i++){x.fillStyle=palette[i%palette.length];x.globalAlpha=0.25+Math.random()*0.5;
    const r=1+Math.random()*3;x.beginPath();x.arc(Math.random()*w,Math.random()*h,r,0,7);x.fill();}x.globalAlpha=1;}

  const sy=140,sh=70;const sg=x.createLinearGradient(0,sy,0,sy+sh);sg.addColorStop(0,'#34281d');sg.addColorStop(0.5,'#463525');sg.addColorStop(1,'#2c2218');

function loadExternalAssets(){

function loadPBR(cfg,mat,sRGB){
  if(!cfg||!mat||!texLoader)return;
  const setRep=t=>{t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(cfg.rx||1,cfg.ry||1);t.anisotropy=renderer.capabilities.getMaxAnisotropy();};
  texLoader.load(cfg.map,t=>{setRep(t);if(sRGB)t.encoding=THREE.sRGBEncoding;mat.map=t;mat.color.setHex(0xffffff);mat.needsUpdate=true;toast('✓ HD textures loaded');},undefined,e=>console.warn('texture load failed (using procedural):',cfg.map));
  if(cfg.normal)texLoader.load(cfg.normal,t=>{setRep(t);mat.normalMap=t;mat.normalScale&&mat.normalScale.set(0.6,0.6);mat.needsUpdate=true;},undefined,()=>{});
  if(cfg.rough)texLoader.load(cfg.rough,t=>{setRep(t);mat.roughnessMap=t;mat.needsUpdate=true;},undefined,()=>{});
}

    strip.position.set(s*(CORRIDOR_W/2+0.45),0.76,0);g.add(strip);
  }
  // tunnel walls (brick PBR) both sides, behind platforms
  for(const s of [-1,1]){
    const wall=new THREE.Mesh(new THREE.BoxGeometry(0.6,WALL_H,SEG_LEN),MAT.wall);
    wall.position.set(s*WALL_X,WALL_H/2-0.5,0);wall.receiveShadow=FX.shadows;g.add(wall);

    band.position.set(s*WALL_X,WALL_H-1.4,0);g.add(band);

      pipe.rotation.x=Math.PI/2;pipe.position.set(s*(WALL_X-0.4),cy,0);g.add(pipe);}
    // support pillars (I-beam look) every half segment
    const pcount=quality==='low'?1:2;
    for(let i=0;i<pcount;i++){const pz=-SEG_LEN/2+ (i+0.5)*(SEG_LEN/pcount);
      const col=new THREE.Mesh(new THREE.BoxGeometry(0.45,WALL_H,0.45),MAT.concrete);col.position.set(s*(CORRIDOR_W/2+2.0),WALL_H/2-0.5,pz);col.castShadow=FX.shadows;g.add(col);

  }
  // ceiling structural ribs (open ceiling lets light through) + light fixtures
  const ribCount=3;
  for(let i=0;i<ribCount;i++){const rz=-SEG_LEN/2+(i+0.5)*(SEG_LEN/ribCount);
    const rib=new THREE.Mesh(new THREE.BoxGeometry(CORRIDOR_W+5.6,0.5,0.7),MAT.ceiling);rib.position.set(0,CEIL_Y,rz);rib.castShadow=FX.shadows;g.add(rib);

  return g;
}

function buildEnvironment(){
  world.lamps=[];

  // dark tunnel backdrop dome (mostly hidden by fog/structure)
  const skyMat=new THREE.ShaderMaterial({side:THREE.BackSide,uniforms:{top:{value:new THREE.Color(0x10151d)},mid:{value:new THREE.Color(0x1b232e)},bottom:{value:new THREE.Color(0x0a0d12)}},
    vertexShader:`varying vec3 vp;void main(){vp=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader:`varying vec3 vp;uniform vec3 top;uniform vec3 mid;uniform vec3 bottom;void main(){float h=normalize(vp).y;vec3 col=h>0.0?mix(mid,top,clamp(h*1.4,0.0,1.0)):mix(mid,bottom,clamp(-h*3.0,0.0,1.0));gl_FragColor=vec4(col,1.0);}`});
  world.sky=new THREE.Mesh(new THREE.SphereGeometry(280,18,12),skyMat);scene.add(world.sky);world.skyMat=skyMat;
  scene.fog=new THREE.Fog(0x12161d,42,VIEW_FAR);

function buildPlayer(){

  const brim=new THREE.Mesh(new THREE.BoxGeometry(0.34,0.04,0.2),cap);brim.position.set(0,0.04,0.2);head.add(brim);
  const ribbon=[];
  function arm(side){const s=new THREE.Group();s.position.set(side*0.4,0.26,0);torso.add(s);

    const knee=new THREE.Group();knee.position.y=-0.46;s.add(knee);

    const foot=new THREE.Mesh(new THREE.BoxGeometry(0.2,0.13,0.4),shoe);foot.position.set(0,-0.44,0.08);knee.add(foot);
    const jet=new THREE.Mesh(new THREE.ConeGeometry(0.12,0.5,10),new THREE.MeshBasicMaterial({color:0x66ccff,transparent:true,opacity:0,depthWrite:false}));
    jet.rotation.x=Math.PI;jet.position.set(0,-0.7,0);knee.add(jet);return {s,knee,jet};}
  const legL=leg(-1),legR=leg(1);
  rig.traverse(c=>{if(c.isMesh)c.castShadow=FX.shadows;});

  player.rig=rig;player.group.add(rig);

function loadGltfCharacter(){
  if(typeof THREE.GLTFLoader==='undefined')return;
  const loader=new THREE.GLTFLoader(loadManager||undefined);
  loader.load(ASSETS.character.url,(g)=>{
    const model=g.scene;model.traverse(o=>{if(o.isMesh){o.castShadow=FX.shadows;o.frustumCulled=false;}});
    const box=new THREE.Box3().setFromObject(model);const size=new THREE.Vector3();box.getSize(size);
    const s=(size.y>0?(ASSETS.character.targetHeight/size.y):1)*(ASSETS.character.scale||1);model.scale.setScalar(s);
    const box2=new THREE.Box3().setFromObject(model);model.position.y=-box2.min.y;
    model.rotation.y=ASSETS.character.faceAway?Math.PI:0;
    player.gltf=model;player.gltfScale=s;player.group.add(model);
    mixer=new THREE.AnimationMixer(model);charActions={};
    g.animations.forEach(c=>{charActions[c.name.toLowerCase()]=mixer.clipAction(c);});
    gltfReady=true;if(player.rig)player.rig.visible=false;setCharAnim('run');
    toast('✓ HD character loaded');
  },undefined,(e)=>{console.warn('GLTF character load failed; using built-in runner.',e);});
}
function setCharAnim(name){
  if(!gltfReady||!mixer)return;
  const map=ASSETS.character.clip||{};let key=(map[name]||name).toLowerCase();
  let act=charActions[key];
  if(!act){for(const k in charActions){if(k.indexOf(key)>=0){act=charActions[k];break;}}}
  if(!act||act===charActive)return;
  if(charActive)charActive.fadeOut(0.18);act.reset().fadeIn(0.18).play();charActive=act;
}
function animateGltf(){
  if(!player.gltf)return;const sc=player.gltfScale||1;
  const base=ASSETS.character.faceAway?Math.PI:0;
  const lean=(player.targetX-player.x)*-0.3;
  player.gltf.rotation.y+=(base-player.gltf.rotation.y)*0.2;
  player.gltf.rotation.z+=(lean-player.gltf.rotation.z)*0.2;
  const rolling=player.state==='roll';
  player.gltf.rotation.x+=((rolling?0.7:0)-player.gltf.rotation.x)*0.25;
  player.gltf.scale.y+=((rolling?sc*0.62:sc)-player.gltf.scale.y)*0.3;
}

function configObstacle(o,type){
  for(const k in o.userData.meshes)o.userData.meshes[k].forEach(m=>m.visible=false);
  o.userData.meshes[type].forEach(m=>m.visible=true);
  o.userData.type=type;o.userData.passed=false;
  o.userData.avoid=(type==='jump'||type==='vehicle')?'jump':(type==='roll'?'roll':'lane');
  if(type==='train')o.userData.box={hx:0.85,top:2.4,bottom:0};
  else if(type==='barrier')o.userData.box={hx:0.85,top:1.3,bottom:0};
  else if(type==='jump')o.userData.box={hx:0.85,top:0.7,bottom:0};
  else if(type==='vehicle')o.userData.box={hx:0.8,top:1.35,bottom:0};
  else o.userData.box={hx:0.95,top:1.95,bottom:1.45};
}

/* ---- Post FX (subtle, realistic) ---- */
function setupPostFX(){
  if(typeof THREE.EffectComposer==='undefined'||typeof THREE.RenderPass==='undefined'){composer=null;return;}
  composer=new THREE.EffectComposer(renderer);renderPass=new THREE.RenderPass(scene,camera);composer.addPass(renderPass);
  if(FX.bloom&&typeof THREE.UnrealBloomPass!=='undefined'){const res=new THREE.Vector2(window.innerWidth,window.innerHeight);
    bloomPass=new THREE.UnrealBloomPass(res,0.3,0.4,0.86);composer.addPass(bloomPass);} // low strength, high threshold = natural
  if(FX.afterimage&&typeof THREE.AfterimagePass!=='undefined'){afterimage=new THREE.AfterimagePass();afterimage.uniforms['damp'].value=0.0;composer.addPass(afterimage);}
}

    lights.amb.color.setHex(0x2e3850);lights.amb.intensity=0.28;lights.hemi.intensity=0.25;lights.hemi.color.setHex(0x3a4664);
    lights.sun.color.setHex(0x9fb0d8);lights.sun.intensity=0.35;if(lights.key)lights.key.intensity=1.5;if(lights.fill)lights.fill.intensity=0.5;

  function(){const open=rand(0,2),r=[null,null,null];for(let l=0;l<3;l++)if(l!==open)r[l]='roll';const cr=[null,null,null];cr[open]='gem';return[r,cr];},

function playerBox(){const rolling=player.state==='roll';return{hx:0.4,bottom:player.y+0.1,top:player.y+(rolling?0.9:2.0)};}

    if(!o.userData.passed&&o.position.z>1.4){o.userData.passed=true;const adx=Math.abs(o.position.x-player.x);if(adx<3.0&&adx>1.2){addTrauma(0.12);Audio.sfx.near();}}
    if(dz>half+0.4)continue;if(Math.abs(o.position.x-player.x)>(o.userData.box.hx+pb.hx))continue;

function collect(){const mr=magnetRange();

    if(mr>0&&Math.abs(dz)<mr&&Math.hypot(dx,c.position.y-1,dz)<mr){c.position.x+=(player.x-c.position.x)*0.25;c.position.y+=(1-c.position.y)*0.25;c.position.z+=(0-c.position.z)*0.25;}
    if(Math.abs(dz)<0.7&&Math.abs(c.position.x-player.x)<0.7&&Math.abs(c.position.y-(player.y+0.9))<1.3){c.userData.taken=true;c.visible=false;let amt=1;if(game.powers.multiplier>0)amt*=2;game.coins+=amt;game.score+=10;spawnBurst(c.position.x,c.position.y,0,0xf6c542,4);Audio.sfx.coin();trackMission('runCoins',amt);}}
  for(const g of world.activeGems){if(g.userData.taken)continue;if(Math.abs(g.position.z)<0.8&&Math.abs(g.position.x-player.x)<0.8&&Math.abs(g.position.y-(player.y+0.9))<1.4){g.userData.taken=true;g.visible=false;game.gems++;game.score+=50;spawnBurst(g.position.x,g.position.y,0,0x2f7fd6,8);Audio.sfx.gem();trackMission('runGems',1);}}
  for(const p of world.activePowerups){if(p.userData.taken)continue;if(Math.abs(p.position.z)<0.9&&Math.abs(p.position.x-player.x)<0.9&&Math.abs(p.position.y-(player.y+0.9))<1.5){p.userData.taken=true;p.visible=false;activatePower(p.userData.kind);spawnBurst(p.position.x,p.position.y,0,POWERUP_INFO[p.userData.kind].color,14);game.runStats.powerups++;trackMission('powerups',1);}}}

function trackMission(kind,amt){if(!save.missions)return;let ch=false;for(const m of save.missions){if(m.claimed)continue;if(m.kind===kind){m.prog=Math.min(m.target,m.prog+amt);ch=true;}}if(ch)persist();}

let fpsSamples=[],fpsCheckT=0,lastFps=60;
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),0.05);
  if(game.running&&!game.paused&&!game.over)update(dt);else idleUpdate(dt);
  spinDecor(dt);updateWorldAtmos(dt);if(mixer)mixer.update(dt);applyCameraFeel(dt);render();monitorFps(dt);}
function render(){if(composer)composer.render();else renderer.render(scene,camera);}
let idleT=0;
function idleUpdate(dt){idleT+=dt;
  for(const s of world.segments){s.position.z+=8*dt;if(s.position.z>SEG_LEN*1.5)s.position.z-=NUM_SEG*SEG_LEN;}
  if(!game.running){player.runT+=dt*8;animatePlayerLimbs();if(player.rig)player.rig.rotation.y=Math.sin(idleT*0.5)*0.1;
    camera.position.x+=(0-camera.position.x)*0.05;camera.position.y+=(5.4-camera.position.y)*0.05;}}
function spinDecor(dt){for(const c of world.activeCoins)if(c.visible)c.rotation.y+=dt*4;
  for(const g of world.activeGems)if(g.visible){g.rotation.y+=dt*2.5;g.rotation.x+=dt*1.5;}
  for(const p of world.activePowerups)if(p.visible){p.rotation.y+=dt*1.5;p.userData.ring.rotation.z+=dt*2.5;p.position.y+=Math.sin(performance.now()*0.004)*0.003;}}
function updateWorldAtmos(dt){
  for(const cl of world.clouds){cl.position.x+=cl.userData.vx*dt;if(cl.position.x>150)cl.position.x=-150;if(cl.position.x<-150)cl.position.x=150;}
  if(world.motes){const a=world.motes.geometry.attributes.position.array;const spd=(game.running?game.speed:6)*dt;
    for(let i=2;i<a.length;i+=3){a[i]+=spd;if(a[i]>10){a[i]-=VIEW_FAR;a[i-2]=(Math.random()-0.5)*30;a[i-1]=Math.random()*10;}}world.motes.geometry.attributes.position.needsUpdate=true;}}
function update(dt){
  game.elapsed+=dt;game.speed=Math.min(game.maxSpeed,game.baseSpeed+game.elapsed*0.45);
  const move=game.speed*dt;game.distance+=move;game.score+=move*2.2*(game.powers.multiplier>0?2:1);save.totalDistance+=move;
  for(const s of world.segments){s.position.z+=move;if(s.position.z>SEG_LEN*1.5)s.position.z-=NUM_SEG*SEG_LEN;}
  scrollEntities(world.activeObstacles,move);scrollEntities(world.activeCoins,move);scrollEntities(world.activeGems,move);scrollEntities(world.activePowerups,move);
  game.nextSpawn+=move;while(game.nextSpawn>-VIEW_FAR)spawnChunk();
  if(game.powers.jetpack>0){const ty=4.0;player.y+=(ty-player.y)*Math.min(1,dt*6);player.vy=0;player.state='fly';}
  else{player.vy+=GRAVITY*dt;player.y+=player.vy*dt;if(player.y<=0){player.y=0;player.vy=0;if(player.state==='jump'){player.state='run';if(gltfReady)setCharAnim('run');addTrauma(0.1);spawnBurst(player.x,0.1,0,0xbbb19a,5);}}
    if(player.state==='roll'){player.rollT-=dt;if(player.rollT<=0&&player.y<=0.05){player.state='run';if(gltfReady)setCharAnim('run');}}}
  player.x+=(player.targetX-player.x)*Math.min(1,dt*16);player.group.position.x=player.x;player.group.position.y=player.y;
  if(player.contact){player.contact.position.y=0.02-player.y;player.contact.material.opacity=0.32*Math.max(0,1-player.y/4);}
  player.runT+=dt*(8+game.speed*0.18);animatePlayerLimbs();
  if(player.rig&&!gltfReady){player.rig.rotation.z+=(((player.targetX-player.x)*0.4)-player.rig.rotation.z)*0.2;
    const rp=player.state==='roll';player.rig.rotation.x+=(((rp)?-0.9:0)-player.rig.rotation.x)*0.25;player.rig.scale.y+=(((rp)?0.6:1)-player.rig.scale.y)*0.3;}
  ['magnet','jetpack','multiplier'].forEach(k=>{if(game.powers[k]>0){game.powers[k]-=dt;if(game.powers[k]<0)game.powers[k]=0;}});
  if(game.elapsed%0.25<dt)updatePowBar();if(game.shieldFlash>0)game.shieldFlash-=dt;
  updateParticles(dt);collect();checkCollision();
  trackMissionSet('runDist',Math.floor(game.distance));trackMissionSet('runScore',Math.floor(game.score));
  document.getElementById('scoreVal').textContent=Math.floor(game.score).toLocaleString();
  document.getElementById('runCoins').textContent=game.coins;document.getElementById('runGems').textContent=game.gems;
  const sp=(game.speed-game.baseSpeed)/(game.maxSpeed-game.baseSpeed);
  document.getElementById('speedfx').style.opacity=(sp*0.28)*(game.powers.jetpack>0?1.3:1);
}
function scrollEntities(active,move){for(let i=active.length-1;i>=0;i--){const e=active[i];e.position.z+=move;if(e.position.z>16){e.visible=false;active.splice(i,1);}}}
function animatePlayerLimbs(){
  if(gltfReady){animateGltf();return;}const J=player.joints;if(!J)return;
  const flame=(player.state==='fly')?1:0;
  J.legL.jet.material.opacity+=((flame?0.7:0)-J.legL.jet.material.opacity)*0.2;J.legR.jet.material.opacity+=((flame?0.7:0)-J.legR.jet.material.opacity)*0.2;
  if(player.state==='fly'){const a=Math.sin(player.runT)*0.15;J.armL.s.rotation.x=-2.2;J.armR.s.rotation.x=-2.2;J.armL.elbow.rotation.x=-0.4;J.armR.elbow.rotation.x=-0.4;J.legL.s.rotation.x=0.3+a;J.legR.s.rotation.x=0.3-a;J.legL.knee.rotation.x=0.2;J.legR.knee.rotation.x=0.2;J.torso.rotation.x=0.2;return;}
  if(player.state==='roll'){J.armL.s.rotation.x=-1.4;J.armR.s.rotation.x=-1.4;J.armL.elbow.rotation.x=-1.6;J.armR.elbow.rotation.x=-1.6;J.legL.s.rotation.x=1.3;J.legR.s.rotation.x=1.3;J.legL.knee.rotation.x=1.8;J.legR.knee.rotation.x=1.8;J.torso.rotation.x=0.6;return;}
  if(player.state==='jump'){J.armL.s.rotation.x=-2.4;J.armR.s.rotation.x=-2.4;J.armL.elbow.rotation.x=-0.5;J.armR.elbow.rotation.x=-0.5;J.legL.s.rotation.x=-0.7;J.legR.s.rotation.x=0.8;J.legL.knee.rotation.x=1.0;J.legR.knee.rotation.x=0.6;J.torso.rotation.x=0.1;return;}
  const a=Math.sin(player.runT)*1.1,b=Math.cos(player.runT);
  J.legL.s.rotation.x=-a;J.legR.s.rotation.x=a;J.legL.knee.rotation.x=Math.max(0,a)*1.4+0.1;J.legR.knee.rotation.x=Math.max(0,-a)*1.4+0.1;
  J.armL.s.rotation.x=a*0.9;J.armR.s.rotation.x=-a*0.9;J.armL.elbow.rotation.x=-0.6-Math.max(0,a)*0.5;J.armR.elbow.rotation.x=-0.6-Math.max(0,-a)*0.5;
  J.torso.rotation.x=0.08+Math.abs(b)*0.04;J.torso.position.y=0.44+Math.abs(b)*0.04;J.head.rotation.x=-0.04;
}
function updateParticles(dt){for(const p of world.particles){if(!p.visible)continue;p.userData.life-=dt;if(p.userData.life<=0){p.visible=false;continue;}
  p.position.x+=p.userData.vx*dt;p.position.y+=p.userData.vy*dt;p.position.z+=p.userData.vz*dt;p.userData.vy+=GRAVITY*0.5*dt;p.rotation.x+=dt*8;p.rotation.y+=dt*6;const s=Math.max(0.01,p.userData.life*1.5);p.scale.set(s,s,s);}}

function applyCameraFeel(dt){
  const sp=game.running?(game.speed-game.baseSpeed)/(game.maxSpeed-game.baseSpeed):0;
  const targetFov=BASE_FOV+sp*12+(game.powers&&game.powers.jetpack>0?5:0);
  const nf=camera.fov+(targetFov-camera.fov)*Math.min(1,dt*4);if(Math.abs(nf-camera.fov)>0.01){camera.fov=nf;camera.updateProjectionMatrix();}
  let bx=player.x*0.3,by=5.4+(game.powers&&game.powers.jetpack>0?0.5:0)+Math.sin((game.elapsed||0)*8)*0.03,bz=9;
  if(game.trauma>0){game.trauma=Math.max(0,game.trauma-dt*1.6);const s=game.trauma*game.trauma,amp=0.45*s;bx+=(Math.random()*2-1)*amp;by+=(Math.random()*2-1)*amp;camera.rotation.z=(Math.random()*2-1)*0.035*s;}else camera.rotation.z*=0.9;
  if(game.running){camera.position.x+=(bx-camera.position.x)*0.1;camera.position.y=by;camera.position.z=bz;camera.lookAt(player.x*0.26,1.6,-8);}
  if(afterimage){const target=game.running?(0.4+sp*0.25):0.0;afterimage.uniforms['damp'].value+=(target-afterimage.uniforms['damp'].value)*Math.min(1,dt*3);}
}
function monitorFps(dt){fpsSamples.push(1/Math.max(dt,0.0001));if(fpsSamples.length>40)fpsSamples.shift();fpsCheckT+=dt;
  if(fpsCheckT>1){fpsCheckT=0;lastFps=fpsSamples.reduce((a,b)=>a+b,0)/fpsSamples.length;
    if(save.settings.showFps){const el=document.getElementById('fps');el.classList.remove('hidden');el.textContent=Math.round(lastFps)+' FPS · '+quality.toUpperCase();}else document.getElementById('fps').classList.add('hidden');
    if(game.running&&lastFps<48)autoDowngrade();}}
let downgradeStep=0;
function autoDowngrade(){
  if(downgradeStep===0){if(afterimage){const i=composer.passes.indexOf(afterimage);if(i>=0)composer.passes.splice(i,1);afterimage=null;}downgradeStep=1;toast('⚙ Optimizing: motion blur off');return;}
  if(downgradeStep===1){if(bloomPass)bloomPass.strength*=0.6;DPR=Math.max(1,DPR*0.85);renderer.setPixelRatio(DPR);if(composer)composer.setSize(window.innerWidth,window.innerHeight);downgradeStep=2;toast('⚙ Optimizing: resolution');return;}
  if(downgradeStep===2){renderer.shadowMap.enabled=false;FX.shadows=false;downgradeStep=3;toast('⚙ Optimizing: shadows off');return;}
}

/* =======================================================================
   FLOW + UI  (unchanged)
   ======================================================================= */
function startRun(){Audio.init();Audio.resume();ensureMissions();resetGame();game.running=true;game.paused=false;game.over=false;
  hideScreen('menu');hideScreen('over');hideScreen('pause');hideScreen('overlay');document.getElementById('hud').classList.remove('hidden');document.getElementById('powBar').innerHTML='';
  if(save.settings.music)Audio.startMusic();trackMission('runs',0);}
function endRun(){game.over=true;game.running=false;Audio.stopMusic();
  save.totalRuns++;save.coins+=game.coins;save.gems+=game.gems;save.totalCoins+=game.coins;
  const fs=Math.floor(game.score),isHigh=fs>save.highScore;if(isHigh)save.highScore=fs;
  trackMission('runs',1);trackMissionSet('runDist',Math.floor(game.distance));trackMissionSet('runScore',fs);checkAchievements(true);injectLeaderboard(fs);persist();
  document.getElementById('speedfx').style.opacity=0;document.getElementById('hud').classList.add('hidden');
  document.getElementById('oScore').textContent=fs.toLocaleString();document.getElementById('oCoins').textContent=game.coins;document.getElementById('oDist').textContent=Math.floor(game.distance);
  document.getElementById('newHigh').classList.toggle('hidden',!isHigh);setTimeout(()=>showScreen('over'),420);}
function togglePause(){if(!game.running)return;game.paused=!game.paused;if(game.paused){showScreen('pause');Audio.stopMusic();}else{hideScreen('pause');if(save.settings.music)Audio.startMusic();}}
function quitToMenu(){game.running=false;game.over=false;game.paused=false;Audio.stopMusic();document.getElementById('speedfx').style.opacity=0;hideScreen('pause');hideScreen('over');document.getElementById('hud').classList.add('hidden');refreshMenu();showScreen('menu');}
function flashHit(){const f=document.getElementById('flash');f.style.opacity='1';setTimeout(()=>f.style.opacity='0',90);}
function flashShield(){const f=document.getElementById('shieldflash');f.style.opacity='1';setTimeout(()=>f.style.opacity='0',260);}
function updatePowBar(){const bar=document.getElementById('powBar');bar.innerHTML='';const items=[];
  if(game.powers.magnet>0)items.push(['magnet',game.powers.magnet]);if(game.powers.jetpack>0)items.push(['jetpack',game.powers.jetpack]);if(game.powers.multiplier>0)items.push(['multiplier',game.powers.multiplier]);if(game.powers.shield)items.push(['shield',-1]);
  for(const [k,t] of items){const info=POWERUP_INFO[k];const div=document.createElement('div');div.className='powchip';const maxT=info.base+save.upgrades[k]*info.perLvl;const pct=t<0?100:Math.max(0,(t/maxT)*100);
    div.innerHTML=`<div class="pi">${info.emoji}</div><div class="pt">${t<0?'ON':Math.ceil(t)+'s'}</div><div class="pbar"><i style="width:${pct}%"></i></div>`;bar.appendChild(div);}}
function showMulti(txt){const el=document.getElementById('multiBadge');el.textContent=txt;el.style.transition='none';el.style.transform='translate(-50%,-50%) scale(1.2)';el.style.opacity='1';requestAnimationFrame(()=>{el.style.transition='all .6s ease';el.style.transform='translate(-50%,-50%) scale(0)';el.style.opacity='0';});}
function checkAchievements(silent){let u=[];for(const a of ACHIEVEMENTS){if(!save.ach[a.id]&&a.check(save)){save.ach[a.id]=true;save.coins+=a.reward;u.push(a);}}if(u.length){persist();for(const a of u)toast(`🏅 ${a.name} unlocked! +${a.reward}●`);}}
function injectLeaderboard(score){let lb=[];try{lb=JSON.parse(rawGet('railrunner_lb')||'null');}catch(e){}if(!lb){const names=['Mara','Kato','Reni','Vex','Juno','Aldo','Sима','Petra','Cole','Dax'];lb=names.map(n=>({name:n,score:rand(3000,28000)}));}
  lb=lb.filter(e=>e.name!=='You');lb.push({name:'You',score:Math.max(score,save.highScore)});lb.sort((a,b)=>b.score-a.score);lb=lb.slice(0,20);rawSet('railrunner_lb',JSON.stringify(lb));}
function showScreen(id){document.getElementById(id).classList.remove('hidden');}
function hideScreen(id){document.getElementById(id).classList.add('hidden');}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800);}
function fmt(n){return n.toLocaleString();}
function refreshMenu(){document.getElementById('mCoins').textContent=fmt(save.coins);document.getElementById('mGems').textContent=fmt(save.gems);document.getElementById('mHigh').textContent=fmt(save.highScore);}
function refreshOvCurrency(){document.getElementById('ovCoins').textContent=fmt(save.coins);document.getElementById('ovGems').textContent=fmt(save.gems);}
function openOverlay(title,builder){document.getElementById('ovTitle').textContent=title;refreshOvCurrency();document.getElementById('ovTabs').classList.add('hidden');renderBody(builder);showScreen('overlay');Audio.sfx.ui();}
function renderBody(b){const e=document.getElementById('ovBody');e.innerHTML='';e.appendChild(b());e.scrollTop=0;}
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function buildShop(){const wrap=el('div');wrap.appendChild(el('p','hint','Gems are premium currency earned by playing. Convert gems to coins, or grab a boost.'));
  const grid=el('div','grid');const offers=[{t:'Gem → 250 Coins',d:'Convert 1 gem',e:'💱',price:1,cur:'gems',act:()=>{save.coins+=250;save.gems-=1;}},
    {t:'Gem Bundle',d:'5 gems → 1500 coins',e:'💰',price:5,cur:'gems',act:()=>{save.coins+=1500;save.gems-=5;}},
    {t:'Free Coins',d:'Simulated ad: +100',e:'🎬',price:0,cur:'coins',free:true,act:()=>{save.coins+=100;}},
    {t:'Mega Coins',d:'+5000 coins (dev gift)',e:'🎁',price:0,cur:'coins',free:true,act:()=>{save.coins+=5000;}}];
  for(const o of offers){const card=el('div','card');const pv=el('div','preview','<span>'+o.e+'</span>');pv.style.background='linear-gradient(135deg,#222831,#3a4453)';card.appendChild(pv);
    card.appendChild(el('h3',null,o.t));card.appendChild(el('div','desc',o.d));const btn=el('button','btn sm '+(o.cur==='gems'?'sec':'gold'),o.free?'GET FREE':(o.cur==='gems'?o.price+' ◆':o.price+' ●'));
    btn.onclick=()=>{if(!o.free&&save[o.cur]<o.price){Audio.sfx.deny();toast('Not enough '+o.cur+'!');return;}o.act();persist();Audio.sfx.buy();toast('Purchased!');refreshOvCurrency();renderBody(buildShop);};card.appendChild(btn);grid.appendChild(card);}
  wrap.appendChild(grid);return wrap;}
function buildSkins(){const grid=el('div','grid');for(const s of SKINS){const owned=save.ownedSkins.includes(s.id),eq=save.equippedSkin===s.id;const card=el('div','card');
  const pv=el('div','preview','<span>'+s.emoji+'</span>');pv.style.background=`radial-gradient(circle at 40% 30%, #${s.body.toString(16).padStart(6,'0')}, #11151b)`;card.appendChild(pv);
  card.appendChild(el('h3',null,s.name));card.appendChild(el('div','desc',s.desc));
  if(eq)card.appendChild(el('div','ribbon eq','EQUIPPED'));else if(!owned)card.appendChild(el('div','ribbon lk','LOCKED'));
  if(eq){const b=el('button','btn sm ghost','✓ Wearing');b.disabled=true;card.appendChild(b);}
  else if(owned){const b=el('button','btn sm','EQUIP');b.onclick=()=>{save.equippedSkin=s.id;rebuildPlayerMesh();persist();Audio.sfx.buy();renderBody(buildSkins);};card.appendChild(b);}
  else{const b=el('button','btn sm '+(s.cur==='gems'?'sec':'gold'),s.cur==='gems'?s.price+' ◆':fmt(s.price)+' ●');
    b.onclick=()=>{if(save[s.cur]<s.price){Audio.sfx.deny();toast('Not enough '+s.cur+'!');return;}save[s.cur]-=s.price;save.ownedSkins.push(s.id);save.equippedSkin=s.id;rebuildPlayerMesh();persist();checkAchievements();Audio.sfx.buy();toast('Unlocked '+s.name+'!');refreshOvCurrency();renderBody(buildSkins);};card.appendChild(b);}
  grid.appendChild(card);}return grid;}
function buildUpgrades(){const wrap=el('div');wrap.appendChild(el('p','hint','Upgrade power-ups to last longer and get a score head-start.'));
  for(const k in UPGRADES){const u=UPGRADES[k],lvl=save.upgrades[k],maxed=lvl>=u.max;const row=el('div','list-row');row.appendChild(el('div','ic',u.emoji));
    const info=el('div','info');info.appendChild(el('h4',null,u.name+'  <span style="color:var(--acc)">Lv '+lvl+'/'+u.max+'</span>'));const prog=el('div','prog');prog.appendChild(el('i'));prog.children[0].style.width=(lvl/u.max*100)+'%';info.appendChild(prog);row.appendChild(info);
    if(maxed)row.appendChild(el('span','tag done','MAX'));else{const cost=u.cost(lvl);const b=el('button','btn sm gold',fmt(cost)+' ●');b.onclick=()=>{if(save.coins<cost){Audio.sfx.deny();toast('Not enough coins!');return;}save.coins-=cost;save.upgrades[k]++;persist();Audio.sfx.buy();refreshOvCurrency();renderBody(buildUpgrades);};row.appendChild(b);}wrap.appendChild(row);}return wrap;}
function buildMissions(){ensureMissions();const wrap=el('div');wrap.appendChild(el('p','hint','New missions every day. ('+save.missionDate+')'));
  for(const m of save.missions){const row=el('div','list-row');row.appendChild(el('div','ic','🎯'));const info=el('div','info');info.appendChild(el('h4',null,m.text));info.appendChild(el('p',null,m.prog+' / '+m.target+'  •  '+m.reward+' ●'));
    const prog=el('div','prog');prog.appendChild(el('i'));prog.children[0].style.width=Math.min(100,m.prog/m.target*100)+'%';info.appendChild(prog);row.appendChild(info);
    if(m.claimed)row.appendChild(el('span','tag done','CLAIMED'));else if(m.prog>=m.target){const t=el('span','tag claim','CLAIM');t.onclick=()=>{m.claimed=true;save.coins+=m.reward;persist();Audio.sfx.claim();toast('+'+m.reward+' coins!');refreshOvCurrency();renderBody(buildMissions);};row.appendChild(t);}else row.appendChild(el('span','tag todo','IN PROGRESS'));wrap.appendChild(row);}return wrap;}
function buildDaily(){const wrap=el('div');const today=todayStr();if(save.daily.lastClaim&&save.daily.lastClaim!==today){const last=new Date(save.daily.lastClaim);const diff=(new Date(today)-last)/86400000;if(diff>1)save.daily.streak=0;save.daily.claimedToday=false;}
  const dayIdx=save.daily.streak%7;wrap.appendChild(el('p','hint','Claim daily; keep the streak for bigger rewards! Streak: '+save.daily.streak+' 🔥'));const grid=el('div','daily');
  DAILY_REWARDS.forEach((d,i)=>{const claimed=i<dayIdx||(i===dayIdx&&save.daily.claimedToday),isToday=i===dayIdx&&!save.daily.claimedToday;const cell=el('div','day'+(claimed?' claimed':'')+(isToday?' today':''));cell.appendChild(el('div','dn','Day '+(i+1)));cell.appendChild(el('div','dr',d.r));cell.appendChild(el('div','dv',d.v));
    if(isToday){cell.style.cursor='pointer';cell.onclick=()=>{if(d.coins)save.coins+=d.coins;if(d.gems)save.gems+=d.gems;if(d.powerup)toast('Power-up appears next run!');save.daily.streak++;save.daily.lastClaim=today;save.daily.claimedToday=true;persist();Audio.sfx.claim();toast('Daily reward claimed!');refreshOvCurrency();renderBody(buildDaily);};}grid.appendChild(cell);});
  wrap.appendChild(grid);if(save.daily.claimedToday)wrap.appendChild(el('p','hint','✓ Come back tomorrow!'));return wrap;}
function buildAch(){const wrap=el('div');let done=0;for(const a of ACHIEVEMENTS){const u=!!save.ach[a.id];if(u)done++;const row=el('div','list-row');row.appendChild(el('div','ic',a.emoji));const info=el('div','info');info.appendChild(el('h4',null,a.name));info.appendChild(el('p',null,a.desc+'  •  +'+a.reward+' ●'));row.appendChild(info);row.appendChild(el('span','tag '+(u?'done':'todo'),u?'✓ DONE':'LOCKED'));wrap.appendChild(row);}wrap.insertBefore(el('p','hint','Unlocked '+done+' / '+ACHIEVEMENTS.length+'.'),wrap.firstChild);return wrap;}
function buildLb(){let lb=[];try{lb=JSON.parse(rawGet('railrunner_lb')||'null');}catch(e){}if(!lb){injectLeaderboard(save.highScore);lb=JSON.parse(rawGet('railrunner_lb'));}const wrap=el('div');wrap.appendChild(el('p','hint','Your high score vs the Rail Runner circuit.'));
  lb.forEach((e,i)=>{const row=el('div','lb-row'+(e.name==='You'?' me':''));const medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1);row.appendChild(el('div','lb-rank',String(medal)));row.appendChild(el('div','lb-name',e.name));row.appendChild(el('div','lb-score',fmt(e.score)));wrap.appendChild(row);});return wrap;}
function buildSettings(){const wrap=el('div');
  const toggle=(label,key,cb)=>{const row=el('div','row-between');row.appendChild(el('span',null,label));const sw=el('div','switch'+(save.settings[key]?' on':''));sw.appendChild(el('i'));sw.onclick=()=>{save.settings[key]=!save.settings[key];sw.classList.toggle('on');persist();cb&&cb(save.settings[key]);Audio.sfx.ui();};row.appendChild(sw);return row;};
  wrap.appendChild(toggle('🎵 Music','music',v=>Audio.setMusic(v)));wrap.appendChild(toggle('🔊 Sound Effects','sfx',v=>Audio.setSfx(v)));
  wrap.appendChild(toggle('🌙 Night Mode','night',v=>applyTimeOfDay(v)));wrap.appendChild(toggle('📊 Show FPS','showFps'));
  const qrow=el('div','row-between');qrow.appendChild(el('span',null,'🎚️ Quality'));const qsel=el('div');qsel.style.display='flex';qsel.style.gap='6px';
  ['auto','low','high','ultra'].forEach(q=>{const b=el('button','btn sm '+(save.settings.quality===q?'gold':'ghost'),q.toUpperCase());b.onclick=()=>{save.settings.quality=q;persist();renderBody(buildSettings);toast('Reload to apply quality');};qsel.appendChild(b);});qrow.appendChild(qsel);wrap.appendChild(qrow);
  wrap.appendChild(el('p','hint','Active profile: <b style="color:var(--acc)">'+quality.toUpperCase()+'</b> · Bloom '+(bloomPass?'ON':'OFF')+' · Motion blur '+(afterimage?'ON':'OFF')+' · Shadows '+(FX.shadows?'ON':'OFF')));
  const reset=el('button','btn sm sec','⚠ RESET ALL PROGRESS');reset.onclick=()=>{if(confirm('Erase all progress?')){save=JSON.parse(JSON.stringify(defaultSave));ensureMissions();persist();rebuildPlayerMesh();applyTimeOfDay(false);refreshMenu();refreshOvCurrency();renderBody(buildSettings);toast('Progress reset.');}};wrap.appendChild(reset);
  wrap.appendChild(el('p','hint','<b>RAIL RUNNER — Pro Edition</b><br>Real animated GLTF character + external PBR textures (with procedural fallback), subway-tunnel environment, detailed trains, cinematic lighting.<br>External assets need internet on first load; for an offline APK, download them and repoint the URLs in the <b>ASSETS</b> block to local files.'));
  return wrap;}
function wire(){const on=(id,fn)=>{document.getElementById(id).addEventListener('click',()=>{Audio.init();Audio.resume();fn();});};
  on('playBtn',startRun);on('pauseBtn',togglePause);on('resumeBtn',togglePause);on('restartBtn',startRun);on('quitBtn',quitToMenu);on('againBtn',startRun);on('overMenuBtn',quitToMenu);
  on('openShop',()=>openOverlay('Shop',buildShop));on('openSkins',()=>openOverlay('Runners',buildSkins));on('openUpgrades',()=>openOverlay('Upgrades',buildUpgrades));
  on('openMissions',()=>openOverlay('Daily Missions',buildMissions));on('openDaily',()=>openOverlay('Daily Reward',buildDaily));on('openAch',()=>openOverlay('Achievements',buildAch));on('openLb',()=>openOverlay('Leaderboard',buildLb));on('openSettings',()=>openOverlay('Settings',buildSettings));
  document.getElementById('ovClose').addEventListener('click',()=>{hideScreen('overlay');refreshMenu();Audio.sfx.ui();});
  document.addEventListener('touchmove',e=>{if(e.target.closest('.panel-body'))return;e.preventDefault();},{passive:false});}
function boot(){try{initThree();wire();refreshMenu();animate();document.getElementById('loading').style.display='none';}
  catch(err){document.getElementById('loading').innerHTML='<p style="color:#ff6b6b;padding:20px;text-align:center">3D engine failed to start.<br>'+err.message+'<br><br>Use a modern WebGL browser.</p>';console.error(err);}}
window.addEventListener('load',()=>setTimeout(boot,250));
})();
